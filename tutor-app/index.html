<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Tutor · Komorebi Studio</title><meta name="description" content="Chat with a local AI tutor, running on your own PC via Ollama."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="app.css?v=6"></head><body>
<header class="tutor-header">
  <button type="button" class="tutor-sidebar-toggle" id="tutorSidebarToggle" aria-label="Toggle saved chats">☰</button>
  <a class="tutor-brand" href="https://komorebi-studio.org"><b>木</b><span><strong>Komorebi</strong><small>PRACTICE STUDIO</small></span></a>
  <a class="tutor-back" href="https://komorebi-studio.org">← Back to site</a>
</header>
<div class="tutor-shell">
  <div class="tutor-sidebar-backdrop" id="tutorSidebarBackdrop"></div>
  <aside class="tutor-sidebar" id="tutorSidebar">
    <div class="tutor-sidebar-actions">
      <button type="button" id="tutorNewChat">+ New chat</button>
      <button type="button" id="tutorNewProject">+ Project</button>
    </div>
    <nav class="tutor-chat-list" id="tutorChatList"><p class="tutor-empty-list">No saved chats yet.</p></nav>
  </aside>

  <main class="tutor-main">
    <p class="kicker">— MINI TUTOR</p>
    <div class="tutor-title-row">
      <h1 id="tutorChatTitle">Talk to your tutor</h1>
      <select id="tutorChatProject"><option value="">No project</option></select>
    </div>
    <p class="tutor-intro">A private chat with a language model running on your own PC.</p>

    <div class="tutor-controls">
      <label for="tutorModel">Model</label>
      <select id="tutorModel">
        <option value="qwen3:8b" selected>Qwen 3 8B (recommended — fast)</option>
        <option value="small-tutor:latest">Small Tutor (Japanese N5–N3 practice)</option>
        <option value="qwen3:4b">Qwen 3 4B (fastest)</option>
        <option value="qwen3:14b">Qwen 3 14B (smartest, slower)</option>
        <option value="gemma3:12b">Gemma 3 12B</option>
        <option value="gemma3:4b">Gemma 3 4B</option>
        <option value="llama3.1:8b">Llama 3.1 8B</option>
      </select>
      <button type="button" id="tutorSpeakToggle" class="tutor-toggle-btn" aria-pressed="false">🔊 Read aloud</button>
      <button type="button" id="tutorVoiceMode" class="tutor-toggle-btn" aria-pressed="false">🎧 Voice mode</button>
      <button type="button" id="tutorDeleteChat">Delete chat</button>
    </div>

    <div class="tutor-voice-row" id="tutorVoiceRow">
      <label for="tutorVoiceEn">English voice</label>
      <select id="tutorVoiceEn"></select>
      <label for="tutorVoiceJa">Japanese voice</label>
      <select id="tutorVoiceJa"></select>
    </div>

    <p class="tutor-status" id="tutorStatus"></p>
    <div class="tutor-chat" id="tutorChat"><p class="tutor-empty">Ask anything — English or Japanese practice, grammar checks, vocab, whatever's useful.</p></div>
    <form class="tutor-form" id="tutorForm">
      <textarea id="tutorInput" placeholder="Type a message…" rows="2" required></textarea>
      <button type="button" id="tutorMic" class="tutor-mic-btn" aria-label="Speak your message" title="Speak your message">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><path d="M12 18v3"/><path d="M9 21h6"/></svg>
      </button>
      <button type="submit" id="tutorSend">Send</button>
    </form>
  </main>
</div>
<script src="app.js?v=7"></script>
</body></html>
